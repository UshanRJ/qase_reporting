# Streamlit Configuration File
# This file configures the Streamlit app's appearance and behavior

[theme]
# Primary color for interactive widgets
primaryColor = "#FF4B4B"

# Background color for the main content area
backgroundColor = "#FFFFFF"

# Background color for sidebar and most interactive widgets
secondaryBackgroundColor = "#F0F2F6"

# Color used for almost all text
textColor = "#262730"

# Font family for all text in the app
font = "sans serif"

[server]
# Port where the server will listen for browser connections
port = 8501

# Whether to enable CORS
enableCORS = true

# Whether to enable xsrf protection
enableXsrfProtection = true

# Max size, in megabytes, for files uploaded
maxUploadSize = 200

# Max size, in megabytes, of messages that can be sent via the WebSocket connection
maxMessageSize = 200

# Whether to enable web socket compression
enableWebsocketCompression = true

[browser]
# Whether to send usage statistics to Streamlit
gatherUsageStats = false

# Internet address where users should point their browsers
# serverAddress = "localhost"

# Whether to open a browser window automatically
# serverPort = 8501

[runner]
# Allows you to type a variable or string by itself in a single line
# of Python code to write it to the app
magicEnabled = true

# Handle script rerun requests immediately,
# rather than waiting for script execution to reach a yield point
fastReruns = true

# Raise an exception after adding unserializable data to Session State
enforceSerializableSessionState = false

[logger]
# Level of logging: 'error', 'warning', 'info', or 'debug'
level = "info"

# String format for logging messages
messageFormat = "%(asctime)s %(levelname)s: %(message)s"

[client]
# Whether to show the "Made with Streamlit" watermark in the app
showErrorDetails = true

[deprecation]
# Whether to show deprecation warnings
showfileUploaderEncoding = false
showPyplotGlobalUse = false
